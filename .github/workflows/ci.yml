name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the Claude Code build this mod is validated against
        run: npm install -g @anthropic-ai/claude-code@2.1.270
      - name: Validate the plugin and marketplace manifests (offline, no API key)
        run: npm run validate
      - name: Unit tests
        run: npm test
